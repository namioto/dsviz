<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>공급망 연쇄 지연</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Source+Code+Pro&display=swap" />
  <link rel="stylesheet" href="../../skills/dsviz/runtime/dsviz.css" />
  <style>
    body { margin: 0; padding: 16px; background: var(--ds-surface-2); }
    main { max-width: 720px; margin: 0 auto; }
  </style>
</head>
<body>
  <main>
    <div id="diagram-1"></div>
  </main>
  <script src="../../skills/dsviz/runtime/dsviz.js"></script>
  <script>
    const stores = ["s1", "s2", "s3", "s4"];
    Dsviz.createDiagram("#diagram-1", {
      caption: "한 지점의 지연이 아래로 내려갈수록 넓게 퍼진다",
      alt: "부품 공장 1곳이 멈추면 조립 공장 2곳이 멈추고, 매장 4곳의 진열대가 빈다",
      draw(g) {
        g.box("part", { x: 300, y: 30, w: 160, h: 50, label: "부품 공장", role: "alert" });
        g.box("asm1", { x: 182, y: 140, w: 140, h: 50, label: "조립 공장 A", role: "alert" });
        g.box("asm2", { x: 438, y: 140, w: 140, h: 50, label: "조립 공장 B", role: "alert" });
        stores.forEach((id, i) => {
          g.box(id, { x: 140 + i * 128, y: 250, w: 96, h: 50, label: `매장 ${i + 1}`, sub: "진열대 빔", role: "alert" });
        });
        g.arrow("e1", { from: "part", to: "asm1", label: "부품", role: "alert" });
        g.arrow("e2", { from: "part", to: "asm2", label: "부품", role: "alert" });
        g.arrow("e3", { from: "asm1", to: "s1", role: "alert" });
        g.arrow("e4", { from: "asm1", to: "s2", role: "alert" });
        g.arrow("e5", { from: "asm2", to: "s3", role: "alert" });
        g.arrow("e6", { from: "asm2", to: "s4", role: "alert" });

        g.chip("r1", { x: 64, y: 55, text: "1곳 멈춤", role: "alert" });
        g.chip("r2", { x: 64, y: 165, text: "2곳 멈춤", role: "alert" });
        g.chip("r3", { x: 64, y: 275, text: "4곳 빔", role: "alert" });
      },
      mobile: {
        width: 360,
        draw(g) {
          g.chip("r1", { x: 180, y: 20, text: "1곳 멈춤", role: "alert" });
          g.box("part", { x: 110, y: 44, w: 140, h: 48, label: "부품 공장", role: "alert" });
          g.chip("r2", { x: 180, y: 150, text: "2곳 멈춤", role: "alert" });
          g.box("asm1", { x: 34, y: 174, w: 120, h: 48, label: "조립 공장 A", role: "alert" });
          g.box("asm2", { x: 206, y: 174, w: 120, h: 48, label: "조립 공장 B", role: "alert" });
          g.chip("r3", { x: 180, y: 280, text: "4곳 빔", role: "alert" });
          stores.forEach((id, i) => {
            g.box(id, { x: 18 + i * 84, y: 304, w: 72, h: 52, label: `매장 ${i + 1}`, sub: "진열대 빔", role: "alert", size: 12, subSize: 10 });
          });
          g.arrow("e1", { from: "part", to: "asm1", role: "alert" });
          g.arrow("e2", { from: "part", to: "asm2", role: "alert" });
          g.arrow("e3", { from: "asm1", to: "s1", role: "alert" });
          g.arrow("e4", { from: "asm1", to: "s2", role: "alert" });
          g.arrow("e5", { from: "asm2", to: "s3", role: "alert" });
          g.arrow("e6", { from: "asm2", to: "s4", role: "alert" });
        },
      },
      sequence: [
        { id: "part", effect: "grow", from: 0.0, to: 0.12 },
        { id: "r1", effect: "fade", from: 0.06, to: 0.16 },
        { id: "part", effect: "highlight", from: 0.12, to: 0.2 },
        { id: "part", effect: "pulse", from: 0.16, to: 0.3 },
        { ids: ["e1", "e2"], effect: "grow", from: 0.22, to: 0.36 },
        { ids: ["e1", "e2"], effect: "highlight", from: 0.22, to: 0.36 },
        { ids: ["asm1", "asm2"], effect: "fade", from: 0.28, to: 0.4, stagger: 0.02 },
        { ids: ["asm1", "asm2"], effect: "highlight", from: 0.38, to: 0.46 },
        { id: "r2", effect: "fade", from: 0.4, to: 0.5 },
        { ids: ["e3", "e4", "e5", "e6"], effect: "grow", from: 0.5, to: 0.64, stagger: 0.02 },
        { ids: ["e3", "e4", "e5", "e6"], effect: "highlight", from: 0.5, to: 0.64 },
        { ids: stores, effect: "fade", from: 0.54, to: 0.66, stagger: 0.02 },
        { ids: stores, effect: "highlight", from: 0.7, to: 0.8, stagger: 0.02 },
        { id: "r3", effect: "fade", from: 0.76, to: 0.88 },
      ],
    });
  </script>
</body>
</html>
